on:
  issues:
    types: [opened]

jobs:
  reroll:
    if: contains(github.event.issue.labels.*.name, 'reroll')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/pick_today_problem.py --reroll
      - run: |
          git config user.name "reroll-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -am "reroll: 오늘의 문제 재추첨" || echo "no changes"
          git push
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed'
            })
