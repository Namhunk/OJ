name: solved.ac streak card

on:
  schedule:
    - cron: "7 15 * * *"   # 매일 00:07 (KST) — UTC 기준 15:07
  workflow_dispatch:        # Actions 탭 → Run workflow 에서 직접 선택해 실행
    inputs:
      theme:
        description: "테마 (기본값: 저장소 변수 THEME)"
        type: choice
        options: [default, light, dark]
        default: default
      mode:
        description: "잔디 색 기준 (기본값: 저장소 변수 STREAK_MODE)"
        type: choice
        options: [default, count, level]
        default: default

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          SOLVEDAC_HANDLE: ${{ vars.SOLVEDAC_HANDLE }}
          SOLVEDAC_CLIENT_ID: ${{ secrets.SOLVEDAC_CLIENT_ID }}
          SOLVEDAC_CLIENT_SECRET: ${{ secrets.SOLVEDAC_CLIENT_SECRET }}
          OUTPUT_PATH: solvedac-streak.svg
          # 우선순위: Run workflow 에서 고른 값 → 저장소 변수 → 기본값
          THEME: ${{ (inputs.theme != '' && inputs.theme != 'default') && inputs.theme || vars.THEME || 'light' }}
          STREAK_MODE: ${{ (inputs.mode != '' && inputs.mode != 'default') && inputs.mode || vars.STREAK_MODE || 'count' }}
        run: python scripts/solvedac_streak.py

      - name: Commit if changed
        run: |
          # 커밋 작성자를 본인 계정으로 설정 (기여자 목록에 본인만 남도록)
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add solvedac-streak.svg
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "Update solved.ac streak card"
            git push
          fi
